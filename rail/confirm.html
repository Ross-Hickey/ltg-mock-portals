<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking confirmed – Rail booking portal</title><link rel="stylesheet" href="/styles.css"><script src="/rail/app.js"></script></head>
<body><header><b>Rail booking portal</b><small>Booking confirmation</small></header>
<div class="demo">Demo environment. Stands in for the CN and CP customer portals.</div>
<main><div id="nav"></div><h1>Booking confirmed</h1><p class="sub">Keep the booking and waybill numbers for your records.</p>
<div class="result" id="confirmation"><table id="t"></table></div></main>
<script>
requireLogin();document.getElementById('nav').innerHTML=nav();
const q=Object.fromEntries(new URLSearchParams(location.search));const key=(q.container||'').replace(/\s/g,'').toUpperCase();
const h=hash(key+q.origin+q.destination+q.departure);
const booking=(q.railway||'RB')+'-BK-'+String(h).padStart(6,'0');const waybill='WB'+String((h*7)%9999991).padStart(7,'0');
const cutoff=addDays(q.departure,-1)+' '+(RAMPS[q.origin]?RAMPS[q.origin][2]:'18:00')+' local';
const eta=addDays(q.departure,transitDays(q.origin,q.destination))+' 06:00 local';
const rows=[["Booking number",booking,"booking-number"],["Waybill number",waybill,"waybill-number"],["Railway",q.railway,"railway"],["Origin ramp",q.origin+' — '+(RAMPS[q.origin]||['',''])[1],"origin"],["Destination ramp",q.destination+' — '+(RAMPS[q.destination]||['',''])[1],"destination"],["Container",q.container,"container"],["Seal",q.seal||'—',"seal"],["Equipment",q.equipment+(q.setpoint?(' at '+q.setpoint+'F, pre-cool '+(q.precool||'—')+'F'):''),"equipment"],["Gross weight",Number(q.weight).toLocaleString()+' lb',"weight"],["Shipper reference",q.reference,"reference"],["Quote number",q.quote||"—","quote-number"],["Booked rate",money(railRate(q.origin,q.destination,q.equipment)),"booked-rate"],["Cut-off",cutoff,"cutoff"],["Departure",q.departure,"departure"],["ETA at destination ramp",eta,"eta"]];
document.getElementById('t').innerHTML=rows.map(r=>`<tr><th>${r[0]}</th><td id="${r[2]}">${r[1]}</td></tr>`).join('');
try{const b=JSON.parse(localStorage.getItem('rb_bookings')||'{}');b[key]={railway:q.railway,origin:q.origin,dest:q.destination,departure:q.departure,eta};localStorage.setItem('rb_bookings',JSON.stringify(b));}catch(e){}
</script></body></html>
